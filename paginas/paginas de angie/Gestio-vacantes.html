<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="encabezado">
    <h1>Gestión de usuarios</h1>
    <p>10 usuarios registrados</p>
  </header>

   <main>

  
    <section class="estadisticas" aria-label="Estadísticas generales">
      <article class="tarjeta-estadistica">
        <span class="icono">👥</span>
        <p class="valor">3.</p>
        <p class="etiqueta">Total de usuarios</p>
      </article>

      <article class="tarjeta-estadistica">
        <span class="icono">👤</span>
        <span class="variacion">↑ 5%</span>
        <p class="valor">3.412</p>
        <p class="etiqueta">Trabajadores activos</p>
      </article>

      <article class="tarjeta-estadistica">
        <span class="icono">🏢</span>
        <span class="variacion">↑ 8%</span>
        <p class="valor">312</p>
        <p class="etiqueta">Empleaadores activos</p>
      </article>

      <article class="tarjeta-estadistica">
        <span class="icono">❌</span>
        <p class="valor">28</p>
        <p class="etiqueta">Cuentas suspendidas</p>
      </article>
    </section>
    
    </main>
</body>
</html>
