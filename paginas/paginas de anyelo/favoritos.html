<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="favoritos.css">
</head>

<body>

    <main class="container-fluid pagina">

        <header class="encabezado">
            <h2>Favoritos</h2>
            <p>3 vacantes guardadas</p>
        </header>

        <section class="row tarjetas">

            <!-- TARJETA 1 -->
            <div class="col-lg-4">
                <article class="card vacante">
                    <div class="card-body">

                        <div class="parte-superior">
                            <div class="empresa-icono">R</div>
                            <i class="bi bi-heart-fill corazon"></i>
                        </div>

                        <h5>Mozo/a de Salón</h5>
                        <p class="empresa">Restaurant La Parrilla</p>

                        <p class="dato">
                            <i class="bi bi-geo-alt"></i> Las Condes
                        </p>

                        <p class="dato">
                            <i class="bi bi-currency-dollar"></i> $580.000 - $700.000
                        </p>

                        <div class="informacion">
                            <span class="tipo">Full-time</span>
                            <span class="guardado">Guardado 25 ago</span>
                        </div>

                        <div class="botones">
                            <button class="btn btn-detalles">Ver detalles</button>
                            <button class="btn btn-postular">Postularme</button>
                        </div>

                    </div>
                </article>
            </div>

            <!-- TARJETA 2 -->
            <div class="col-lg-4">
                <article class="card vacante">
                    <div class="card-body">

                        <div class="parte-superior">
                            <div class="empresa-icono">S</div>
                            <i class="bi bi-heart-fill corazon"></i>
                        </div>

                        <h5>Reponedor/a</h5>
                        <p class="empresa">Supermercado Vea</p>

                        <p class="dato">
                            <i class="bi bi-geo-alt"></i> Ñuñoa
                        </p>

                        <p class="dato">
                            <i class="bi bi-currency-dollar"></i> $520.000
                        </p>

                        <div class="informacion">
                            <span class="tipo">Part-time</span>
                            <span class="guardado">Guardado 22 ago</span>
                        </div>

                        <div class="botones">
                            <button class="btn btn-detalles">Ver detalles</button>
                            <button class="btn btn-postular">Postularme</button>
                        </div>

                    </div>
                </article>
            </div>

            <!-- TARJETA 3 -->
            <div class="col-lg-4">
                <article class="card vacante">
                    <div class="card-body">

                        <div class="parte-superior">
                            <div class="empresa-icono">F</div>
                            <i class="bi bi-heart-fill corazon"></i>
                        </div>

                        <h5>Cajero/a</h5>
                        <p class="empresa">Ferretería El Clavo</p>

                        <p class="dato">
                            <i class="bi bi-geo-alt"></i> Maipú
                        </p>

                        <p class="dato">
                            <i class="bi bi-currency-dollar"></i> $550.000
                        </p>

                        <div class="informacion">
                            <span class="tipo">Part-time</span>
                            <span class="guardado">Guardado 18 ago</span>
                        </div>

                        <div class="botones">
                            <button class="btn btn-detalles">Ver detalles</button>
                            <button class="btn btn-postular">Postularme</button>
                        </div>

                    </div>
                </article>
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
